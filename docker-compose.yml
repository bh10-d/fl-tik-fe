version: '3.8'

services:
  fl-tik-fe:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api/v1}
    image: fl-tik-fe:1.0.0
    container_name: fl-tik-fe
    restart: always
    env_file:
      - .env
    ports:
      - "5173:5173"
